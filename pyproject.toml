[project]
name = "ai-jd-generator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vangapanduyeswanth-wq", email = "vangapanduyeswanth@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "groq>=1.7.0",
    "psycopg2-binary>=2.9.12",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.13.4",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]

[project.scripts]
ai-jd-generator = "ai_jd_generator:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
